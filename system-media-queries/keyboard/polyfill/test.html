<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard Media Queries polyfill: tests</title>
<script src="keyboard-media-queries.js"></script>
<style>
  @media (virtual-keyboard: visible) { #probe { color: rgb(0, 128, 0); } }
  @supports (color: red) { @media not (keyboard) { #probe-nested { color: rgb(0, 128, 0); } } }
</style>
<p id="probe"></p><p id="probe-nested"></p>
<input id="text"><input id="checkbox" type="checkbox"><div id="editable" contenteditable></div>
<pre id="log"></pre>
<script>
  'use strict';
  const log = document.getElementById('log');
  const tests = [];
  const test = (name, body) => tests.push([name, body]);
  const matches = (query, state) => matchMedia(KeyboardMediaQueries.evaluate(query, state)).matches;
  const color = (id) => getComputedStyle(document.getElementById(id)).color;
  const GREEN = 'rgb(0, 128, 0)';

  // Each case is [query, state, expected].
  function expectAll(cases) {
    const wrong = cases.filter(([query, state, expected]) => matches(query, state) !== expected);
    if (wrong.length) throw new Error(wrong.map(([q, s, e]) => `${q} with ${JSON.stringify(s)} should be ${e}`).join('; '));
  }

  test('keyboard compares with none and physical', () => expectAll([
    ['(keyboard: physical)', { keyboard: 'physical' }, true],
    ['(keyboard: none)', { keyboard: 'physical' }, false],
    ['(keyboard)', { keyboard: 'physical' }, true],
    ['(keyboard)', { keyboard: 'none' }, false],
  ]));

  test('virtual-keyboard compares with hidden and visible', () => expectAll([
    ['(virtual-keyboard: visible)', { 'virtual-keyboard': 'visible' }, true],
    ['(virtual-keyboard)', { 'virtual-keyboard': 'hidden' }, false],
    ['not (virtual-keyboard)', { 'virtual-keyboard': 'hidden' }, true],
    ['(keyboard: none) and (virtual-keyboard: visible)', { keyboard: 'none', 'virtual-keyboard': 'visible' }, true],
  ]));

  test('an unknown keyboard makes the feature unknown', () => expectAll([
    ['(keyboard: physical)', { keyboard: undefined }, false],
    ['not (keyboard: physical)', { keyboard: undefined }, false],
    ['(keyboard) or (min-width: 0px)', { keyboard: undefined }, true],
  ]));

  test('invalid values and range syntax are unknown', () => expectAll([
    ['(keyboard: virtual)', { keyboard: 'physical' }, false],
    ['not (keyboard: virtual)', { keyboard: 'physical' }, false],
    ['(virtual-keyboard > hidden)', {}, false],
    ['not (virtual-keyboard > hidden)', {}, false],
  ]));

  test('text fields and editable elements count as typing, other controls don\'t', () => {
    const typing = (id) => KeyboardMediaQueries.typingInto(document.getElementById(id));
    if (!typing('text') || !typing('editable') || typing('checkbox') || KeyboardMediaQueries.typingInto(null)) {
      throw new Error('wrong elements count as typing');
    }
  });

  test('style sheets are rewritten, including nested rules', () => {
    KeyboardMediaQueries.pretend({ keyboard: 'none', 'virtual-keyboard': 'visible' });
    const on = [color('probe'), color('probe-nested')];
    KeyboardMediaQueries.pretend({ keyboard: 'physical', 'virtual-keyboard': 'hidden' });
    const off = [color('probe'), color('probe-nested')];
    KeyboardMediaQueries.pretend(null);
    if (on.some((c) => c !== GREEN) || off.some((c) => c === GREEN)) {
      throw new Error(`expected green then not, got ${on} then ${off}`);
    }
  });

  addEventListener('DOMContentLoaded', () => {
    let failed = 0;
    for (const [name, body] of tests) {
      try {
        body();
        log.textContent += `PASS ${name}\n`;
      } catch (e) {
        failed++;
        log.textContent += `FAIL ${name}: ${e.message}\n`;
      }
    }
    log.textContent += `${tests.length - failed} of ${tests.length} passed\n`;
  });
</script>
